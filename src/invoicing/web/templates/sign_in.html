<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rechnungen">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" href="/static/icon-32.png" type="image/png">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml" sizes="any">
<title>Anmelden</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="sign-in">
  <h1 class="page-title">Rechnungen</h1>
  {% if failed %}
  <p class="warn">Passwort stimmt nicht.</p>
  {% endif %}
  <form method="post" action="/anmelden" class="stack">
    <label>Passwort
      <input type="password" name="password" autocomplete="current-password" required autofocus>
    </label>
    <button class="button button-fill button-large" type="submit">Anmelden</button>
  </form>
</main>
</body>
</html>
