<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rechnungen">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" href="/static/icon-32.png" type="image/png">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml" sizes="any">
<title>Kein Netz</title>
<script>
try {
  var thema = localStorage.getItem("thema");
  if (thema) document.documentElement.dataset.theme = thema;
} catch (ignored) {}
</script>
<link rel="stylesheet" href="/static/app.css?v={{ static_version }}">
</head>
<body>
<main class="sign-in">
  <h1 class="page-title">Kein Netz</h1>
  <p>Diese Seite ist nicht gespeichert. Stunden abhaken und Rechnungen brauchen Internet.</p>
  <div class="stack">
    <button class="button button-fill button-large" type="button" id="nochmal">Nochmal versuchen</button>
    <a class="button button-large" href="/">Zum Kalender</a>
  </div>
</main>
<script>
document.getElementById("nochmal").addEventListener("click", function () {
  location.reload();
});
</script>
</body>
</html>
