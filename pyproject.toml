[project]
name = "rechnungsersteller"
version = "0.1.0"
description = "Automatische Rechnungserstellung fuer Nachhilfestunden"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "argon2-cffi>=25.1.0",
    "babel",
    "fastapi>=0.141.1",
    "holidays>=0.102",
    "itsdangerous>=2.2.0",
    "jinja2",
    "pydantic-settings>=2.14.2",
    "python-dateutil",
    "python-multipart>=0.0.32",
    "pywebpush>=2.4.0",
    "sqlmodel",
    "uvicorn>=0.52.0",
    "weasyprint",
]

[dependency-groups]
# Playwright lives here rather than in the runtime dependencies: it is only
# needed where WeasyPrint cannot run, which is Windows. A Linux server has the
# libraries WeasyPrint wants and installs neither Playwright nor its 150 MB
# browser.
dev = [
    "black",
    "complexipy",
    "pdfplumber",
    "playwright",
    "pre-commit",
    "pydeps",
    "pytest",
    "radon",
    "ruff",
    "skylos",
    "types-python-dateutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoicing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["dependency_graph.svg"]

[tool.ruff.lint]
# The invoice wording uses a real en dash, as German business letters do.
allowed-confusables = ["–"]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "A",   # builtins shadowing
    "C4",  # comprehensions
    "SIM", # simplify
    "PTH", # pathlib
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request data with these markers in argument defaults. They
# build immutable descriptors rather than values, which is what this setting
# is for.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Form",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.skylos]
# SKY-D223 reads only [project.dependencies]. It therefore cannot see the tools
# declared in [dependency-groups] (PEP 735) nor this project's own package.
# SKY-Q802 and SKY-Q803 measure distance from Robert Martin's main sequence.
# Concrete leaf modules such as money or billing_period score badly there by
# construction, and adding abstract base classes to satisfy the metric would
# make the code worse, not better.
ignore = ["SKY-D223", "SKY-Q802", "SKY-Q803"]

[tool.skylos.gate]
max_dead_code = 0
max_secrets = 0
max_security = 0
max_quality = 0
max_ai_defects = 0

[tool.pyright]
include = ["src", "main.py", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
